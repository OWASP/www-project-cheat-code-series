name: Java outcome matrix

# Runs the PoC test suite and builds the cross-platform matrix report.
#
# Only ONE combination is a hard gate: Windows on JDK 21. That is the only
# combination whose expectations have actually been observed and declared. The
# rest run for information, because a red result there means "nobody has recorded
# what this does yet", not "something regressed":
#
#   Linux / macOS  - the `..\..\` payload is declared with on(WINDOWS, ...) only,
#                    since backslash is a separator on Windows and an ordinary
#                    filename character on POSIX. Those cells report UNDECLARED by
#                    design. The uploaded results are how they get declared: read
#                    them, check each observed outcome is correct, then add the
#                    on(LINUX, ...) variants and promote this job to a gate.
#   JDK 17         - the project's declared floor (README, maven.compiler.source),
#                    raised from 11 in August 2026 when Spring moved to 7.0.8 to
#                    clear four advisories that have no fix on the 5.3.x line.
#                    Expectations were recorded on 21 and 25. Never observed on 17.
#                    If this job goes red, the "Java 17+" claim is the thing to
#                    check, not the matrix.
#
# Promote a combination to required by removing it from the continue-on-error
# expression below, once its cells are declared.

# The path lists are duplicated on purpose: GitHub's workflow parser does not
# reliably support YAML anchors, so keep these two in sync by hand.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/java-outcome-matrix.yaml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/java-outcome-matrix.yaml'
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  outcome-matrix:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    # Windows on JDK 21 is the gate; everything else is informational for now.
    continue-on-error: ${{ !(matrix.os == 'windows-latest' && matrix.java == '21') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        java:
          - '17'
          - '21'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run the outcome matrix
        run: mvn -B clean test

      # if: always() - a failing run is exactly when the recorded cells are worth
      # reading, since they carry the observed outcome for every UNDECLARED cell.
      - name: Upload recorded cells
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-jdk${{ matrix.java }}
          path: target/cheatcode-results/
          if-no-files-found: warn

  report:
    name: Merged matrix report
    needs: outcome-matrix
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # test-compile rather than test: the results come from the matrix jobs
      # above, and re-running the suite here would overwrite them with Linux-only
      # data. No `clean`, for the same reason.
      - name: Compile the harness
        run: mvn -B -DskipTests test-compile

      # One JDK only. The platform key does not carry a JDK, so merging both would
      # have the two runs overwrite each other's cells under the same platform.
      - name: Collect results from every platform
        uses: actions/download-artifact@v4
        with:
          pattern: results-*-jdk21
          merge-multiple: true
          path: target/cheatcode-results

      - name: Generate the report
        run: mvn -B exec:java@report

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: outcome-matrix-report
          path: target/report/
          if-no-files-found: error
